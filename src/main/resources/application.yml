spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas_fcv_training}
    username: ${DB_USER:citas_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**
app:
  jwt:
    issuer: citas-api
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cookie:
    secure: ${REFRESH_COOKIE_SECURE:true}
    same-site: ${REFRESH_COOKIE_SAME_SITE:None}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
  n8n:
    status-webhook:
      # Empty URL keeps the no-op adapter (no outbound calls). Values come only from the environment.
      url: ${N8N_STATUS_WEBHOOK_URL:}
      bearer-token: ${N8N_STATUS_WEBHOOK_BEARER_TOKEN:}
